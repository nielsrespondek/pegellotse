name: Build

# Baut nur bei Versions-Tags: Version hochziehen, committen, dann
#   git tag v1.0.1 && git push origin v1.0.1
#
# Ergebnis ist ein ZIP mit der portablen Ordnerversion. Darin steckt ein
# eigenes Python von python.org — es entsteht keine unsignierte EXE, das Paket
# laeuft daher auch bei aktivem Smart App Control.
on:
  push:
    branches: [main]      # baut ein herunterladbares Artefakt
    tags: ["v*"]          # baut zusaetzlich ein Release
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Messkern prüfen
        run: python selftest.py

      - name: Versionsnummer aus dem Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content pegellotse.py) -replace '^VERSION = ".*"', "VERSION = ""$v""" |
            Set-Content pegellotse.py
          Write-Host "Version: $v"

      # Baut das Paket und prueft es anschliessend mit dem eingebetteten Python
      - name: Portables Paket bauen
        run: python paket_bauen.py --zip --ausgabe paket

      - uses: actions/upload-artifact@v4
        with:
          name: Pegellotse-portabel
          path: paket/Pegellotse-portabel.zip
          retention-days: 30

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: paket/Pegellotse-portabel.zip
          generate_release_notes: true
          body: |
            ZIP herunterladen, **vollständig entpacken** und
            **Pegellotse starten.bat** doppelklicken.

            Python muss nicht installiert sein — es liegt im Paket bei. Da
            nichts kompiliert wird, entsteht auch keine unsignierte
            Programmdatei: das Paket startet auch dort, wo Smart App Control
            aktiv ist.
